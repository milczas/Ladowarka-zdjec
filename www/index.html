<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uruchamianie Ładowarki ROD Borówka</title>
    
    <script>
        window.onload = function() {
            setTimeout(function() {
                // TUTAJ WPISZ SWÓJ PEŁNY ADRES DO KATALOGU FOTODOKUMENTY:
                window.location.href = "https://milczas.pl/fotodokumenty/index.php";
            }, 1000);
        };
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        
        /* Elegancki tryb ciemny na start */
        body { background-color: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #ffffff; text-align: center; }
        
        .launch-box { background: #1e1e1e; width: 100%; max-width: 400px; padding: 40px 20px; border-radius: 16px; border: 1px solid #2d2d2d; box-shadow: 0 4px 25px rgba(0,0,0,0.6); }
        
        .icon { font-size: 45px; margin-bottom: 20px; display: inline-block; animation: spin 2s linear infinite; }
        
        h1 { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #ffffff; }
        p { font-size: 14px; color: #3b9eff; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        
        .loading-text { font-size: 15px; color: #aaaaaa; }
        
        /* Animacja obracania ikonki ładowania */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="launch-box">
    <span class="icon">🔄</span>
    
    <h1>ROD Borówka</h1>
    <p>Automatyczna Ładowarka Zdjęć</p>
    
    <div class="loading-text">Łączenie z serwerem, proszę czekać...</div>
</div>

</body>
</html>
